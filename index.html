<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type="url"] { font-size: 16px; }
        .progress-transition { transition: width 0.3s ease-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-900 to-black text-white min-h-[100dvh] flex flex-col selection:bg-blue-500 selection:text-white">
    
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8">
        <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 sm:p-10 rounded-[32px] shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] w-full max-w-md text-center transition-all duration-300 relative">
            
            <div id="erro-toast" class="hidden absolute -top-16 left-0 right-0 bg-red-500/95 text-white text-sm font-bold py-3 px-4 rounded-xl shadow-lg transition-all z-50">
                <span id="texto-erro">Erro ao processar.</span>
            </div>

            <div class="mb-8">
                <div class="flex justify-center mb-4 text-5xl">
                    <i class="fa-brands fa-x-twitter text-white"></i>
                </div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-gray-200 to-gray-500">
                    X Downloader
                </h1>
                <p class="text-gray-400 mt-3 text-sm leading-relaxed px-2">
                    Cole o link do post para transferir o vídeo original em MP4.
                </p>
            </div>
            
            <form id="form-download" action="/baixar" method="POST" class="space-y-5">
                
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-gray-300 text-gray-500">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <input type="url" id="link-input" name="url" placeholder="Ex: https://x.com/user/status/123..." required
                        class="w-full pl-12 pr-4 h-14 rounded-2xl bg-black/40 border border-white/10 focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-500/50 transition-all text-gray-100 placeholder-gray-500">
                </div>
                
                <button type="submit" id="btn-download"
                    class="relative w-full overflow-hidden bg-white hover:bg-gray-200 text-black font-bold h-14 rounded-2xl transition-all shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_30px_rgba(255,255,255,0.3)] active:scale-95 flex items-center justify-center group">
                    <span id="btn-text" class="flex items-center text-lg">
                        <i class="fa-solid fa-download mr-2 group-hover:scale-110 transition-transform"></i> Transferir Vídeo
                    </span>
                    <i id="btn-spinner" class="fa-solid fa-spinner fa-spin hidden text-2xl"></i>
                </button>

                <div id="progress-container" class="hidden w-full mt-2 transition-all duration-500 opacity-0">
                    <div class="flex justify-between mb-1.5 px-1">
                        <span class="text-xs font-semibold text-gray-300 animate-pulse">A extrair do X...</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-2.5 border border-white/5 overflow-hidden">
                        <div id="progress-bar" class="bg-gray-300 h-2.5 rounded-full progress-transition" style="width: 0%"></div>
                    </div>
                </div>

            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById('form-download');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const btnDownload = document.getElementById('btn-download');
        const toast = document.getElementById('erro-toast');
        const textoErro = document.getElementById('texto-erro');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        function mostrarErro(mensagem) {
            textoErro.textContent = mensagem;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 4000);
        }

        form.addEventListener('submit', function(e) {
            const urlInput = document.getElementById('link-input').value.toLowerCase();
            
            // Validação de segurança local para garantir que é um link válido
            if (!urlInput.includes('x.com') && !urlInput.includes('twitter.com')) {
                e.preventDefault();
                mostrarErro("Por favor, cole um link válido do X ou Twitter.");
                return;
            }

            // Ativa a interface de carregamento
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            btnDownload.style.opacity = '0.5';
            btnDownload.style.pointerEvents = 'none';
            
            progressContainer.classList.remove('hidden', 'opacity-0');
            progressBar.style.width = '0%';
            
            let progresso = 0;
            let intervalo = setInterval(() => {
                if (progresso < 90) progresso += 2;
                progressBar.style.width = `${progresso}%`;
            }, 100);

            // Restaura o botão após alguns segundos (tempo suficiente para o navegador iniciar o download do anexo)
            setTimeout(() => {
                clearInterval(intervalo);
                progressBar.style.width = '100%';
                setTimeout(() => {
                    btnText.classList.remove('hidden');
                    btnSpinner.classList.add('hidden');
                    btnDownload.style.opacity = '1';
                    btnDownload.style.pointerEvents = 'auto';
                    progressContainer.classList.add('opacity-0');
                    setTimeout(() => progressContainer.classList.add('hidden'), 500);
                }, 500);
            }, 5000);
        });
    </script>
</body>
</html>
