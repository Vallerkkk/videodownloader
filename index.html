<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        input[type="url"] { font-size: 16px; } /* evita zoom automático no iOS */

        /* ---------- Fundo animado ---------- */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .45;
            animation: float 20s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(35px, -45px) scale(1.12); }
            66%      { transform: translate(-28px, 30px) scale(.94); }
        }

        .bg-grid {
            background-image:
                linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
            background-size: 54px 54px;
            -webkit-mask-image: radial-gradient(ellipse 75% 60% at 50% 40%, #000 25%, transparent 100%);
            mask-image: radial-gradient(ellipse 75% 60% at 50% 40%, #000 25%, transparent 100%);
        }

        /* ---------- Cartão ---------- */
        .card { animation: rise .75s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes rise {
            from { opacity: 0; transform: translateY(26px) scale(.97); }
            to   { opacity: 1; transform: none; }
        }

        /* Borda em gradiente */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg,
                rgba(255,255,255,.32) 0%,
                rgba(255,255,255,.04) 38%,
                rgba(139,92,246,.45) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            pointer-events: none;
        }

        /* ---------- Barra de progresso ---------- */
        .progress-fill {
            background: linear-gradient(90deg, #6366f1, #a855f7, #22d3ee, #6366f1);
            background-size: 300% 100%;
            animation: slide 2.4s linear infinite;
            transition: width .35s cubic-bezier(.4, 0, .2, 1);
            box-shadow: 0 0 12px rgba(139, 92, 246, .6);
        }
        @keyframes slide { to { background-position: 300% 0; } }

        /* ---------- Toast ---------- */
        #erro-toast {
            transform: translate(-50%, -18px) scale(.96);
            opacity: 0;
            pointer-events: none;
            transition: all .35s cubic-bezier(.2,.8,.2,1);
        }
        #erro-toast.show {
            transform: translate(-50%, 0) scale(1);
            opacity: 1;
        }

        /* ---------- Shake (erro no input) ---------- */
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(3px); }
            30%, 50%, 70% { transform: translateX(-5px); }
            40%, 60% { transform: translateX(5px); }
        }
        .shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both; }

        /* ---------- Ícone da marca ---------- */
        @keyframes glowPulse {
            0%, 100% { opacity: .55; transform: scale(1); }
            50%      { opacity: .95; transform: scale(1.08); }
        }
        .logo-glow { animation: glowPulse 4s ease-in-out infinite; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body class="relative min-h-[100dvh] flex flex-col bg-[#050508] text-white overflow-x-hidden selection:bg-indigo-500/40 selection:text-white">

    <!-- ================= FUNDO ================= -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_#14142b_0%,_#050508_65%)]"></div>
        <div class="blob w-[440px] h-[440px] bg-indigo-600 -top-40 -left-28"></div>
        <div class="blob w-[380px] h-[380px] bg-fuchsia-600 top-1/3 -right-32" style="animation-delay:-7s"></div>
        <div class="blob w-[340px] h-[340px] bg-cyan-500 -bottom-32 left-1/4" style="animation-delay:-13s"></div>
        <div class="absolute inset-0 bg-grid"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/70"></div>
    </div>

    <!-- ================= TOAST ================= -->
    <div id="erro-toast"
         class="fixed top-5 left-1/2 z-50 flex items-center gap-3 max-w-[92vw] px-5 py-3.5 rounded-2xl
                bg-red-500/10 border border-red-500/30 backdrop-blur-xl
                text-red-100 text-sm font-medium shadow-[0_20px_50px_-12px_rgba(239,68,68,.45)]">
        <i class="fa-solid fa-circle-exclamation text-red-400 text-base shrink-0"></i>
        <span id="texto-erro">Erro ao processar.</span>
    </div>

    <!-- ================= CONTEÚDO ================= -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8">
        <div class="card relative w-full max-w-[430px] rounded-[32px] p-6 sm:p-9 text-center
                    bg-white/[0.045] backdrop-blur-2xl
                    shadow-[0_30px_90px_-25px_rgba(0,0,0,.95)]">

            <!-- Cabeçalho -->
            <header class="mb-8">
                <div class="relative inline-flex mb-5">
                    <div class="logo-glow absolute inset-0 rounded-2xl bg-gradient-to-br from-indigo-500 via-fuchsia-500 to-cyan-400 blur-2xl"></div>
                    <div class="relative w-16 h-16 rounded-2xl bg-white/[0.06] border border-white/15
                                backdrop-blur-xl flex items-center justify-center
                                shadow-[inset_0_1px_0_rgba(255,255,255,.15)]">
                        <i class="fa-brands fa-x-twitter text-3xl text-white"></i>
                    </div>
                </div>

                <h1 class="text-[32px] leading-none font-extrabold tracking-tight
                           bg-gradient-to-b from-white via-white to-white/50 bg-clip-text text-transparent">
                    X Downloader
                </h1>

                <p class="text-sm text-white/45 mt-3 leading-relaxed max-w-[290px] mx-auto">
                    Cole o link do post para transferir o vídeo original em <span class="text-white/70 font-medium">MP4</span>.
                </p>
            </header>

            <!-- Formulário -->
            <form id="form-download" action="/baixar" method="POST" class="space-y-5" novalidate>

                <!-- Input -->
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none
                                text-white/30 group-focus-within:text-indigo-300 transition-colors duration-300">
                        <i class="fa-solid fa-link text-sm"></i>
                    </div>

                    <input type="url" id="link-input" name="url" inputmode="url" autocomplete="off" spellcheck="false"
                           placeholder="https://x.com/user/status/..."
                           class="w-full h-14 pl-11 pr-[86px] rounded-2xl
                                  bg-black/45 border border-white/10
                                  text-white placeholder-white/25
                                  outline-none transition-all duration-300
                                  focus:border-indigo-400/60 focus:bg-black/60
                                  focus:shadow-[0_0_0_4px_rgba(99,102,241,.16),0_0_28px_-6px_rgba(139,92,246,.6)]">

                    <button type="button" id="btn-colar"
                            class="absolute right-2 top-1/2 -translate-y-1/2 h-10 px-3.5 rounded-xl
                                   bg-white/[0.06] hover:bg-white/[0.12] border border-white/10
                                   text-[11px] font-semibold uppercase tracking-wider text-white/60 hover:text-white
                                   transition-all duration-200 active:scale-95">
                        Colar
                    </button>
                </div>

                <!-- Botão principal -->
                <div class="relative group">
                    <div class="absolute -inset-[3px] rounded-[20px] opacity-30 blur-[14px] transition-opacity duration-500
                                group-hover:opacity-70
                                bg-gradient-to-r from-indigo-500 via-fuchsia-500 to-cyan-400"></div>

                    <button type="submit" id="btn-download"
                            class="relative w-full h-14 rounded-2xl
                                   bg-gradient-to-b from-white to-gray-200 text-black
                                   font-bold text-[15px] tracking-tight
                                   shadow-[0_12px_34px_-14px_rgba(255,255,255,.55)]
                                   transition-all duration-300
                                   hover:-translate-y-0.5 hover:shadow-[0_18px_46px_-14px_rgba(255,255,255,.75)]
                                   active:translate-y-0 active:scale-[.98]
                                   disabled:opacity-60 disabled:pointer-events-none
                                   flex items-center justify-center">
                        <span id="btn-text" class="flex items-center gap-2.5">
                            <i class="fa-solid fa-arrow-down-long"></i>
                            Transferir Vídeo
                        </span>
                        <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden text-xl"></i>
                    </button>
                </div>

                <!-- Progresso -->
                <div id="progress-container" class="hidden opacity-0 transition-opacity duration-500 pt-1">
                    <div class="flex items-center justify-between mb-2 px-1">
                        <span class="flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wider text-white/50">
                            <span class="relative flex h-1.5 w-1.5">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-indigo-400"></span>
                            </span>
                            A extrair do X...
                        </span>
                        <span id="progress-pct" class="text-[11px] font-bold text-white/50 tabular-nums">0%</span>
                    </div>

                    <div class="w-full h-2 rounded-full bg-white/[0.07] border border-white/5 overflow-hidden">
                        <div id="progress-bar" class="progress-fill h-full rounded-full" style="width:0%"></div>
                    </div>
                </div>

            </form>

            <!-- Rodapé -->
            <p class="mt-7 text-[11px] leading-relaxed text-white/25">
                Use apenas para conteúdo próprio ou de domínio público.
            </p>
        </div>
    </main>

    <script>
        const form              = document.getElementById('form-download');
        const input             = document.getElementById('link-input');
        const btnText           = document.getElementById('btn-text');
        const btnSpinner        = document.getElementById('btn-spinner');
        const btnDownload       = document.getElementById('btn-download');
        const btnColar          = document.getElementById('btn-colar');
        const toast             = document.getElementById('erro-toast');
        const textoErro         = document.getElementById('texto-erro');
        const progressContainer = document.getElementById('progress-container');
        const progressBar       = document.getElementById('progress-bar');
        const progressPct       = document.getElementById('progress-pct');

        let toastTimer = null;
        let intervalo  = null;

        /* ---------- Utilitários ---------- */
        function mostrarErro(mensagem) {
            textoErro.textContent = mensagem;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function animarErroInput() {
            input.classList.remove('shake');
            void input.offsetWidth;      // reinicia a animação
            input.classList.add('shake');
            setTimeout(() => input.classList.remove('shake'), 600);
        }

        function linkValido(valor) {
            try {
                const url  = new URL(valor);
                const host = url.hostname.replace(/^www\./, '').toLowerCase();
                return ['x.com', 'twitter.com'].some(d => host === d || host.endsWith('.' + d));
            } catch {
                return false;
            }
        }

        function estadoCarregando(ativo) {
            btnText.classList.toggle('hidden', ativo);
            btnSpinner.classList.toggle('hidden', !ativo);
            btnDownload.disabled = ativo;
        }

        /* ---------- Botão "Colar" ---------- */
        btnColar.addEventListener('click', async () => {
            try {
                const texto = await navigator.clipboard.readText();
                if (texto && texto.trim()) {
                    input.value = texto.trim();
                    input.focus();
                } else {
                    mostrarErro('A área de transferência está vazia.');
                }
            } catch {
                mostrarErro('Não foi possível aceder à área de transferência.');
            }
        });

        /* ---------- Submissão ---------- */
        form.addEventListener('submit', function (e) {
            const valor = input.value.trim();

            if (!linkValido(valor)) {
                e.preventDefault();
                mostrarErro('Por favor, cole um link válido do X ou Twitter.');
                animarErroInput();
                input.focus();
                return;
            }

            // Interface de carregamento
            estadoCarregando(true);
            progressContainer.classList.remove('hidden');
            requestAnimationFrame(() => progressContainer.classList.remove('opacity-0'));

            progressBar.style.width = '0%';
            progressPct.textContent = '0%';

            let progresso = 0;
            clearInterval(intervalo);
            intervalo = setInterval(() => {
                if (progresso < 90) {
                    progresso += Math.random() * 3 + 0.6;
                    if (progresso > 90) progresso = 90;
                    progressBar.style.width = progresso + '%';
                    progressPct.textContent = Math.round(progresso) + '%';
                }
            }, 110);

            // Finaliza visualmente enquanto o navegador descarrega o anexo
            setTimeout(() => {
                clearInterval(intervalo);
                progressBar.style.width = '100%';
                progressPct.textContent = '100%';

                setTimeout(() => {
                    estadoCarregando(false);
                    progressContainer.classList.add('opacity-0');
                    setTimeout(() => {
                        progressContainer.classList.add('hidden');
                        progressBar.style.width = '0%';
                        progressPct.textContent = '0%';
                    }, 500);
                }, 500);
            }, 5000);
        });
    </script>
</body>
</html>
