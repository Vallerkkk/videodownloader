<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type="url"] { font-size: 16px; }
        .progress-transition { transition: width 0.4s ease-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-900 to-black text-white min-h-[100dvh] flex flex-col selection:bg-blue-500 selection:text-white">
    
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8">
        <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 sm:p-10 rounded-[32px] shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] w-full max-w-md text-center transition-all duration-300 relative">
            
            <div id="erro-toast" class="hidden absolute -top-24 left-0 right-0 bg-red-500/95 text-white text-sm font-bold py-3 px-4 rounded-xl shadow-lg transition-all z-50">
                <span id="texto-erro">Erro ao processar.</span>
                <p id="motivo-erro" class="font-normal text-xs mt-1 opacity-90 truncate hover:whitespace-normal"></p>
            </div>

            <!-- Aviso de Redirecionamento (Failsafe) -->
            <div id="aviso-seguro" class="hidden absolute -top-16 left-0 right-0 bg-blue-600/95 text-white text-sm font-bold py-3 px-4 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.6)] transition-all z-50 animate-pulse">
                <span><i class="fa-solid fa-route mr-2"></i> Rota congestionada. A ativar alternativa segura...</span>
            </div>

            <div class="mb-8">
                <div class="flex justify-center gap-3 mb-4 text-2xl text-gray-400">
                    <i class="fa-brands fa-youtube hover:text-red-500 transition-colors"></i>
                    <i class="fa-brands fa-tiktok hover:text-white transition-colors"></i>
                    <i class="fa-brands fa-instagram hover:text-pink-500 transition-colors"></i>
                    <i class="fa-brands fa-x-twitter hover:text-blue-400 transition-colors"></i>
                </div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                    Downloader Pro
                </h1>
                <p class="text-gray-400 mt-3 text-sm leading-relaxed px-2">
                    Cole o link de qualquer rede social para extrair a multimédia.
                </p>
            </div>
            
            <form id="form-download" action="/baixar" method="POST" class="space-y-5">
                
                <div class="flex gap-4 mb-2">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="formato" value="video" id="formato-video" class="peer sr-only" checked>
                        <div class="rounded-xl border border-white/10 bg-black/40 py-3 text-center peer-checked:bg-blue-600 peer-checked:border-blue-400 peer-checked:shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all text-sm font-semibold text-gray-300 peer-checked:text-white">
                            <i class="fa-solid fa-video mr-2"></i> Vídeo
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="formato" value="audio" id="formato-audio" class="peer sr-only">
                        <div class="rounded-xl border border-white/10 bg-black/40 py-3 text-center peer-checked:bg-purple-600 peer-checked:border-purple-400 peer-checked:shadow-[0_0_15px_rgba(147,51,234,0.4)] transition-all text-sm font-semibold text-gray-300 peer-checked:text-white">
                            <i class="fa-solid fa-music mr-2"></i> Áudio
                        </div>
                    </label>
                </div>

                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-blue-400 text-gray-500">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <input type="url" id="link-input" name="url" placeholder="Cole a URL do post ou vídeo..." required
                        class="w-full pl-12 pr-4 h-14 rounded-2xl bg-black/40 border border-white/10 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all text-gray-100 placeholder-gray-500">
                </div>
                
                <button type="submit" id="btn-download"
                    class="relative w-full overflow-hidden bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold h-14 rounded-2xl transition-all shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:shadow-[0_0_30px_rgba(59,130,246,0.5)] active:scale-95 flex items-center justify-center group">
                    <span id="btn-text" class="flex items-center text-lg">
                        <i class="fa-solid fa-bolt mr-2 group-hover:scale-110 transition-transform"></i> Processar
                    </span>
                    <i id="btn-spinner" class="fa-solid fa-spinner fa-spin hidden text-2xl"></i>
                </button>

                <div id="progress-container" class="hidden w-full mt-2 transition-all duration-500 opacity-0">
                    <div class="flex justify-between mb-1.5 px-1">
                        <span class="text-xs font-semibold text-blue-400 animate-pulse">A extrair multimédia...</span>
                        <span id="progress-text" class="text-xs font-bold text-white">0%</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-2.5 border border-white/5 overflow-hidden">
                        <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-purple-500 h-2.5 rounded-full progress-transition shadow-[0_0_10px_rgba(147,51,234,0.6)]" style="width: 0%"></div>
                    </div>
                </div>

            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById('form-download');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const btnDownload = document.getElementById('btn-download');
        const toast = document.getElementById('erro-toast');
        const avisoSeguro = document.getElementById('aviso-seguro');
        const textoErro = document.getElementById('texto-erro');
        const motivoErro = document.getElementById('motivo-erro');
        
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        let intervaloProgresso;

        async function fetchComTimeout(url, options = {}, tempoLimite = 8000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), tempoLimite);
            try {
                const resposta = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                if (!resposta.ok) throw new Error(`Status ${resposta.status}`);
                return resposta;
            } catch (erro) {
                clearTimeout(id);
                if (erro.name === 'AbortError') throw new Error("Timeout");
                if (erro.message.includes('Failed to fetch')) throw new Error("CORS/Bloqueio");
                throw erro; 
            }
        }

        function iniciarProgresso() {
            progressContainer.classList.remove('hidden');
            setTimeout(() => progressContainer.classList.remove('opacity-0'), 50);
            let progresso = 0;
            progressBar.style.width = '0%';
            progressText.innerText = '0%';
            clearInterval(intervaloProgresso);
            intervaloProgresso = setInterval(() => {
                if (progresso < 40) progresso += 1.5; 
                else if (progresso < 80) progresso += 0.8; 
                else if (progresso < 95) progresso += 0.15; 
                progressBar.style.width = `${progresso}%`;
                progressText.innerText = `${Math.floor(progresso)}%`;
            }, 150);
        }

        function finalizarProgresso() {
            clearInterval(intervaloProgresso);
            progressBar.style.width = '100%';
            progressText.innerText = '100%';
        }

        function mostrarCarregamento() {
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            btnDownload.style.opacity = '0.5';
            btnDownload.style.pointerEvents = 'none';
            toast.classList.add('hidden');
            avisoSeguro.classList.add('hidden');
            iniciarProgresso();
        }

        function restaurarBotao() {
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
            btnDownload.style.opacity = '1';
            btnDownload.style.pointerEvents = 'auto';
            clearInterval(intervaloProgresso);
            progressContainer.classList.add('opacity-0');
            setTimeout(() => progressContainer.classList.add('hidden'), 500);
        }

            function ativarResgate(urlOriginal) {
            avisoSeguro.classList.remove('hidden');
            progressBar.style.width = '100%';
            progressText.innerText = 'Redirecionando...';
            
            // Redireciona o utilizador para a interface web oficial e segura do Cobalt
            setTimeout(() => {
                window.location.href = `https://cobalt.tools/?u=${encodeURIComponent(urlOriginal)}`;
            }, 2500);
        }

        form.addEventListener('submit', async function(e) {
            const urlInput = document.getElementById('link-input').value;
            const isAudio = document.getElementById('formato-audio').checked;
            const urlLower = urlInput.toLowerCase();

            if (urlLower.includes('youtube.com') || urlLower.includes('youtu.be')) {
                e.preventDefault(); 
                mostrarCarregamento();

                let linkDireto = null;
                let logDeErros = []; 

                // TÚNEL 1: O CORS PROXY + APIs do Cobalt
                const cobaltInstances = [
                    "https://api.cobalt.canine.tools/api/json",
                    "https://cobalt-api.peuk.dev/api/json"
                ];

                for (let api of cobaltInstances) {
                    try {
                        // Passamos o URL da API através do corsproxy.io para furar o bloqueio do navegador!
                        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(api);
                        const resposta = await fetchComTimeout(proxyUrl, {
                            method: "POST",
                            headers: { "Accept": "application/json", "Content-Type": "application/json" },
                            body: JSON.stringify({ url: urlInput, vCodec: "h264", isAudioOnly: isAudio })
                        }, 8000); 
                        
                        const dados = await resposta.json();
                        linkDireto = dados.url || (dados.picker && dados.picker.length > 0 ? dados.picker[0].url : null);
                        if (linkDireto) break;
                    } catch (err) { 
                        logDeErros.push(`CBLT: ${err.message}`);
                    }
                }

                // TÚNEL 2: O CORS PROXY + APIs do Invidious
                if (!linkDireto) {
                    const match = urlInput.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
                    if (match) {
                        const videoId = match[1];
                        const invidiousInstances = [
                            "https://inv.tux.pizza",
                            "https://invidious.jing.rocks"
                        ];
                        
                        for (let inst of invidiousInstances) {
                            try {
                                const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(`${inst}/api/v1/videos/${videoId}`);
                                const res = await fetchComTimeout(proxyUrl, {}, 8000);
                                const data = await res.json();
                                if (isAudio && data.adaptiveFormats) {
                                    const audios = data.adaptiveFormats.filter(f => f.type.includes('audio'));
                                    if (audios.length > 0) {
                                        linkDireto = `${inst}/latest_version?id=${videoId}&itag=${audios.sort((a, b) => b.bitrate - a.bitrate)[0].itag}&local=true`;
                                        break;
                                    }
                                } else if (data.formatStreams && data.formatStreams.length > 0) {
                                    linkDireto = `${inst}/latest_version?id=${videoId}&itag=${data.formatStreams[0].itag}&local=true`;
                                    break;
                                }
                            } catch (err) { 
                                logDeErros.push(`INVD: ${err.message}`);
                            }
                        }
                    }
                }

                // O VEREDITO FINAL
                if (linkDireto) {
                    finalizarProgresso();
                    setTimeout(() => {
                        window.location.href = linkDireto;
                        setTimeout(restaurarBotao, 2000);
                    }, 500); 
                } else {
                    // MODO RESGATE: Se todas as APIs falharem e o Proxy for abaixo, enviamos o utilizador para a Rota Segura!
                    console.log("Erros capturados:", logDeErros.join(" | "));
                    ativarResgate(urlInput);
                }
            } else {
                mostrarCarregamento();
                setTimeout(restaurarBotao, 15000);
            }
        });
    </script>
</body>
</html>
