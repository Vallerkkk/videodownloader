<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type="url"] { font-size: 16px; }
        .progress-transition { transition: width 0.3s ease-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-900 to-black text-white min-h-[100dvh] flex flex-col selection:bg-blue-500 selection:text-white">
    
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8">
        <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 sm:p-10 rounded-[32px] shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] w-full max-w-md text-center transition-all duration-300 relative">
            
            <div id="erro-toast" class="hidden absolute -top-24 left-0 right-0 bg-red-500/95 text-white text-sm font-bold py-3 px-4 rounded-xl shadow-lg transition-all z-50">
                <span id="texto-erro">Erro ao processar.</span>
                <p id="motivo-erro" class="font-normal text-xs mt-1 opacity-90 truncate hover:whitespace-normal"></p>
            </div>

            <div class="mb-8">
                <div class="flex justify-center gap-3 mb-4 text-2xl text-gray-400">
                    <i class="fa-brands fa-youtube hover:text-red-500 transition-colors"></i>
                    <i class="fa-brands fa-tiktok hover:text-white transition-colors"></i>
                    <i class="fa-brands fa-instagram hover:text-pink-500 transition-colors"></i>
                    <i class="fa-brands fa-x-twitter hover:text-blue-400 transition-colors"></i>
                </div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                    Downloader Pro
                </h1>
                <p class="text-gray-400 mt-3 text-sm leading-relaxed px-2">
                    Cole a ligação de qualquer rede social para extrair a multimédia.
                </p>
            </div>
            
            <form id="form-download" action="/baixar" method="POST" class="space-y-5">
                <div class="flex gap-4 mb-2">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="formato" value="video" id="formato-video" class="peer sr-only" checked>
                        <div class="rounded-xl border border-white/10 bg-black/40 py-3 text-center peer-checked:bg-blue-600 peer-checked:border-blue-400 peer-checked:shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all text-sm font-semibold text-gray-300 peer-checked:text-white">
                            <i class="fa-solid fa-video mr-2"></i> Vídeo
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="formato" value="audio" id="formato-audio" class="peer sr-only">
                        <div class="rounded-xl border border-white/10 bg-black/40 py-3 text-center peer-checked:bg-purple-600 peer-checked:border-purple-400 peer-checked:shadow-[0_0_15px_rgba(147,51,234,0.4)] transition-all text-sm font-semibold text-gray-300 peer-checked:text-white">
                            <i class="fa-solid fa-music mr-2"></i> Áudio
                        </div>
                    </label>
                </div>

                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-blue-400 text-gray-500">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <input type="url" id="link-input" name="url" placeholder="Cole a URL do post ou vídeo..." required
                        class="w-full pl-12 pr-4 h-14 rounded-2xl bg-black/40 border border-white/10 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all text-gray-100 placeholder-gray-500">
                </div>
                
                <button type="submit" id="btn-download"
                    class="relative w-full overflow-hidden bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold h-14 rounded-2xl transition-all shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:shadow-[0_0_30px_rgba(59,130,246,0.5)] active:scale-95 flex items-center justify-center group">
                    <span id="btn-text" class="flex items-center text-lg">
                        <i class="fa-solid fa-bolt mr-2 group-hover:scale-110 transition-transform"></i> Processar
                    </span>
                    <i id="btn-spinner" class="fa-solid fa-spinner fa-spin hidden text-2xl"></i>
                </button>

                <!-- BARRA DE PROGRESSO REAL -->
                <div id="progress-container" class="hidden w-full mt-2 transition-all duration-500 opacity-0">
                    <div class="flex justify-between mb-1.5 px-1">
                        <span id="progress-status" class="text-xs font-semibold text-blue-400 animate-pulse">A comunicar com o servidor...</span>
                        <span id="progress-text" class="text-xs font-bold text-white">0%</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-2.5 border border-white/5 overflow-hidden">
                        <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-purple-500 h-2.5 rounded-full progress-transition shadow-[0_0_10px_rgba(147,51,234,0.6)]" style="width: 0%"></div>
                    </div>
                </div>

            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById('form-download');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const btnDownload = document.getElementById('btn-download');
        const toast = document.getElementById('erro-toast');
        const textoErro = document.getElementById('texto-erro');
        const motivoErro = document.getElementById('motivo-erro');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressStatus = document.getElementById('progress-status');

        function atualizarBarraVisual(porcentagem, mensagem = "A converter ficheiro...") {
            progressContainer.classList.remove('hidden', 'opacity-0');
            progressBar.style.width = `${porcentagem}%`;
            progressText.innerText = `${porcentagem}%`;
            progressStatus.innerText = mensagem;
            if(porcentagem >= 100) {
                progressText.innerText = '100%';
                progressStatus.innerText = "Concluído! A iniciar download...";
            }
        }

        function mostrarCarregamento() {
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            btnDownload.style.opacity = '0.5';
            btnDownload.style.pointerEvents = 'none';
            toast.classList.add('hidden');
            atualizarBarraVisual(0, 'A preparar extração...');
        }

        function restaurarBotao() {
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
            btnDownload.style.opacity = '1';
            btnDownload.style.pointerEvents = 'auto';
            progressContainer.classList.add('opacity-0');
            setTimeout(() => progressContainer.classList.add('hidden'), 500);
        }

        function mostrarErro(mensagem, logTecnico) {
            textoErro.textContent = mensagem;
            motivoErro.textContent = logTecnico;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 8000);
            restaurarBotao();
        }

        form.addEventListener('submit', async function(e) {
            const urlInput = document.getElementById('link-input').value;
            const isAudio = document.getElementById('formato-audio').checked;
            const urlLower = urlInput.toLowerCase();

            if (urlLower.includes('youtube.com') || urlLower.includes('youtu.be')) {
                e.preventDefault(); 
                mostrarCarregamento();

                let formato = isAudio ? 'mp3' : '720';
                let urlEncoded = encodeURIComponent(urlInput);
                let idTarefa = null;
                let provedor = null;
                let usarBackendProxy = false;

                // FASE 1: OBTER O ID DA TAREFA DA FÁBRICA DE CONVERSÃO
                try {
                    // Tenta aceder diretamente da internet do utilizador (Método AZK nativo)
                    const res = await fetch(`https://p.oceansaver.in/ajax/download.php?format=${formato}&url=${urlEncoded}&api=dfcb6d76f2f6a9894gjkege8a4ab232222`);
                    const data = await res.json();
                    if (data.success == 1 && data.id) {
                        idTarefa = data.id;
                        provedor = "oceansaver";
                    } else { throw new Error("A API rejeitou o pedido."); }
                } catch (err) {
                    // FASE 2 (TÚNEL DE SEGURANÇA): Se o Adblocker bloqueou, usamos o Python do Render!
                    usarBackendProxy = true;
                    try {
                        const res = await fetch('/proxy/iniciar', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: urlInput, formato: formato })
                        });
                        const data = await res.json();
                        if (data.success && data.id) {
                            idTarefa = data.id;
                            provedor = data.provedor;
                        } else { throw new Error("Túnel de segurança falhou."); }
                    } catch (err2) {
                        mostrarErro("Serviço indisponível.", "Os servidores de conversão estão desligados.");
                        return;
                    }
                }

                // FASE 3: POLLING (ACOMPANHAMENTO DO PROGRESSO REAL)
                if (idTarefa) {
                    let concluido = false;
                    let tentativasFalhas = 0;

                    while (!concluido) {
                        await new Promise(r => setTimeout(r, 2000)); // Pergunta à API a cada 2 segundos
                        
                        try {
                            let resProgresso, dataProgresso;
                            
                            if (!usarBackendProxy) {
                                resProgresso = await fetch(`https://p.oceansaver.in/ajax/progress.php?id=${idTarefa}`);
                                dataProgresso = await resProgresso.json();
                                if (dataProgresso.success == 1) {
                                    let pct = Math.floor(dataProgresso.progress / 10);
                                    atualizarBarraVisual(pct > 100 ? 100 : pct);
                                    if (dataProgresso.progress >= 1000 || dataProgresso.download_url) {
                                        concluido = true;
                                        window.location.href = dataProgresso.download_url;
                                        setTimeout(restaurarBotao, 2000);
                                    }
                                } else {
                                    throw new Error(dataProgresso.text || "Vídeo protegido.");
                                }
                            } else {
                                // Polling pelo Túnel Python
                                resProgresso = await fetch(`/proxy/progresso?id=${idTarefa}&provedor=${provedor}`);
                                dataProgresso = await resProgresso.json();
                                if (dataProgresso.success) {
                                    atualizarBarraVisual(dataProgresso.progress);
                                    if (dataProgresso.download_url) {
                                        concluido = true;
                                        window.location.href = dataProgresso.download_url;
                                        setTimeout(restaurarBotao, 2000);
                                    }
                                } else {
                                    throw new Error(dataProgresso.text || "Falha remota.");
                                }
                            }
                        } catch (e) {
                            // Se der um erro na resposta, espera e tenta de novo (até 8 vezes)
                            tentativasFalhas++;
                            if (e.message && e.message !== "Failed to fetch" && tentativasFalhas > 1) {
                                mostrarErro("Conversão rejeitada.", e.message);
                                concluido = true;
                            } else if(tentativasFalhas > 8) {
                                mostrarErro("Tempo esgotado.", "O servidor demorou demasiado tempo a processar.");
                                concluido = true;
                            }
                        }
                    }
                }
            } else {
                // PARA TIKTOK E X/TWITTER (Processado no Backend Python)
                mostrarCarregamento();
                let progressoFalso = 0;
                let intervaloSimulacao = setInterval(() => {
                    if (progressoFalso < 92) progressoFalso += 2;
                    atualizarBarraVisual(progressoFalso, 'A extrair do servidor local...');
                }, 150);
                
                setTimeout(() => { 
                    clearInterval(intervaloSimulacao); 
                    restaurarBotao(); 
                }, 15000);
            }
        });
    </script>
</body>
</html>
